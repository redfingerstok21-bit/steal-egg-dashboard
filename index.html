<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥚 Steal an Egg · Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="dashboard" id="dashboard">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="egg-icon">
                    <i class="fas fa-egg"></i>
                </div>
                <h1>Steal <span>an Egg</span></h1>
            </div>
            <div class="server-badge" id="serverBadge">
                <i class="fas fa-circle"></i> 
                <span id="serverStatus">🔍 Mencari server...</span>
            </div>
        </div>

        <!-- INPUT SERVER ID -->
        <div class="server-input-container">
            <div class="input-group">
                <i class="fas fa-server"></i>
                <input type="text" id="serverIdInput" placeholder="Masukkan Server ID (contoh: 123456789)" />
                <button onclick="connectToServer()" id="connectBtn">
                    <i class="fas fa-link"></i> Hubungkan
                </button>
            </div>
            <div id="connectionInfo" class="connection-info"></div>
        </div>

        <!-- DAFTAR PLAYER -->
        <div class="players-section">
            <div class="section-header">
                <h2><i class="fas fa-users"></i> Player Aktif</h2>
                <span id="playerCount">0 player</span>
            </div>
            <div id="playersList" class="players-grid">
                <div class="empty-state">
                    <i class="fas fa-user-slash"></i>
                    <p>Belum ada player yang menjalankan script</p>
                    <p class="sub-text">Jalankan script Roblox untuk muncul di sini</p>
                </div>
            </div>
        </div>

        <!-- PLAYER DETAIL -->
        <div id="playerDetail" class="player-detail" style="display: none;">
            <div class="detail-header">
                <h2 id="detailPlayerName"><i class="fas fa-user"></i> Player</h2>
                <button onclick="closePlayerDetail()" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="detail-grid">
                <div class="detail-card">
                    <div class="detail-label"><i class="fas fa-coins"></i> INCOME/S</div>
                    <div class="detail-value" id="detailIncome">0.00 $/s</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label"><i class="fas fa-wallet"></i> MONEY</div>
                    <div class="detail-value" id="detailMoney">0 $</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label"><i class="fas fa-bolt"></i> SPEED</div>
                    <div class="detail-value" id="detailSpeed">0 km/h</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label"><i class="fas fa-crown"></i> TOP PET</div>
                    <div class="detail-value" id="detailPet">-</div>
                </div>
            </div>
            <div class="detail-pet">
                <div class="pet-info">
                    <span id="detailPetName">-</span>
                    <span class="rarity-badge" id="detailPetRarity">-</span>
                    <span id="detailPetIncome">0.00 $/s</span>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="server-note">
            <div>
                <i class="fas fa-shield-alt"></i> 
                <span id="footerStatus">Menunggu koneksi...</span>
            </div>
            <div>
                <span class="status-dot" id="statusDot"></span> 
                <span style="color: #b5c2e0;">status: <span id="connectionStatus" style="color: #ffd43b; font-weight: 500;">offline</span></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
